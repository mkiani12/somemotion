<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>شاهین — گالری تمپلیت‌ها</title>
<link rel="stylesheet" href="../assets/shahin-tokens.css"/>
<link rel="stylesheet" href="../assets/shahin-components.css"/>
<link rel="stylesheet" href="../assets/shahin-responsive.css"/>
<style>
/* ══ v11 — PM 2026-11-14: Shahin has no «ready-made dashboards», only the templates it prepares in a gallery. v10 with the page
   renamed «گالری تمپلیت‌ها» / «Template gallery» (title, breadcrumb, nav, back link, open button, empty states); nothing else changes. ══ */
/* ══ v7 — PM 2026-10-31, ready dashboards = templates ══
   The page reads as Amplitude's template gallery filtered to Shahin's business-type templates. The gallery, card, starter and
   role-card pieces are copied from report-builder/rb-amp-builder.css + rb-shell.css (the builder's template gallery,
   rb-amp-templates.js) so both surfaces look like one product; the builder's files are not touched. Every colour via --sh-*. */
[hidden]{display:none!important}
.ph{display:inline-flex;flex-shrink:0}
.ph svg{width:100%;height:100%;fill:currentColor}

/* ── shared header pieces (from rb-shell.css) ── */
.rbx-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rbx-title{font-size:16px;font-weight:800;color:var(--sh-text);min-width:0;display:inline-flex;align-items:center}
.rbx-sub{font-size:11.5px;color:var(--sh-muted);line-height:1.9}
.rbx-spacer{flex:1}
.rbx-crumb{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--sh-muted);background:none;border:1px dashed transparent;border-radius:var(--sh-radius);padding:3px 7px;cursor:pointer;font-family:inherit;align-self:flex-start}
.rbx-crumb:hover{border-color:var(--sh-border-2);color:var(--sh-text-2)}
.rbx-crumb .ph{width:14px;height:14px}
.rbx-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:var(--sh-radius-pill);border:1px solid var(--sh-border-2);background:var(--sh-neutral-bg);color:var(--sh-text-2);white-space:nowrap}
.rbx-badge .ph{width:12px;height:12px}
.rbx-callout{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.85;color:var(--sh-text-2);background:var(--sh-info-bg);border:1px solid var(--sh-info-border);border-radius:var(--sh-radius);padding:9px 11px}
.rbx-callout.warn{background:var(--sh-warn-bg);border-color:var(--sh-warn-border)}
.rbx-callout>.ph{width:16px;height:16px;margin-top:2px;color:var(--sh-info)}
.rbx-callout.warn>.ph{color:var(--sh-warn)}
.rbx-search{display:flex;align-items:center;gap:6px;border:1px solid var(--sh-border-2);border-radius:var(--sh-radius);background:var(--sh-surface-2);padding:0 9px;min-height:34px}
.rbx-search .ph{width:15px;height:15px;color:var(--sh-muted)}
.rbx-search input{border:none;background:none;outline:none;color:var(--sh-text);font:inherit;font-size:12px;flex:1;min-width:0}
.rbx-item{display:flex;align-items:center;gap:8px;width:100%;text-align:start;background:none;border:none;cursor:pointer;font:inherit;font-size:12px;color:var(--sh-text-2);padding:7px 8px;border-radius:calc(var(--sh-radius) - 3px);min-width:0;text-decoration:none}
.rbx-item:hover{background:var(--sh-neutral-bg)}
.rbx-item.on{background:var(--sh-brand-soft);color:var(--sh-brand);font-weight:800}
.rbx-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbx-item .ct{font-size:10px;color:var(--sh-muted-2)}
.rbx-item .ph{width:15px;height:15px;opacity:.85}
.sh-btn .ph{width:15px;height:15px}
.sh-btn[disabled]{opacity:.5;cursor:not-allowed}
a.sh-btn{text-decoration:none}
.rbx-head .sh-btn,.cap-code-copy{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

/* ── gallery (from rb-amp-builder.css «Template gallery») ── */
.tg-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
.tg-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px;min-width:0}
.tg-nav .rbx-search{margin-bottom:8px}
.tg-navh{font-size:10.5px;font-weight:800;color:var(--sh-muted);letter-spacing:.02em;padding:12px 10px 4px}
.tg-navfoot{margin-top:10px;padding-top:10px;border-top:1px solid var(--sh-border)}
.tg-main{min-width:0;display:flex;flex-direction:column;gap:14px}
.tg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tg-card{display:flex;flex-direction:column;text-align:start;background:var(--sh-surface);border:1px solid var(--sh-border);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;color:var(--sh-text);font:inherit;min-width:0;transition:border-color var(--sh-duration-fast,120ms) var(--sh-ease-standard,ease-out),box-shadow var(--sh-duration-fast,120ms) var(--sh-ease-standard,ease-out)}
.tg-card:hover,.tg-card:focus-visible{border-color:var(--sh-brand-border);box-shadow:var(--sh-shadow-1)}
.tg-thumb{display:block;background:var(--sh-surface-2);border-bottom:1px solid var(--sh-border);padding:10px 12px}
.tg-thumb>svg{display:block;width:100%;height:72px}
.tg-pane{fill:var(--sh-surface);stroke:var(--sh-border)}
.tg-c1{fill:var(--sh-c1)}.tg-c2{fill:var(--sh-c2)}
.tg-line{fill:none;stroke:var(--sh-c1);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.tg-cbody{display:flex;flex-direction:column;gap:7px;padding:12px 14px 12px}
.tg-ctitle{display:flex;align-items:center;gap:7px;font-size:13.5px}
.tg-ctitle .ph{width:17px;height:17px;color:var(--sh-brand)}
.tg-cdesc{font-size:11.5px;line-height:1.7;color:var(--sh-muted)}
.tg-cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11px;color:var(--sh-muted)}
.tg-cfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;font-size:10.5px;color:var(--sh-muted);border-top:1px solid var(--sh-border);padding-top:8px;margin-top:2px}
.tg-cfoot .auto{display:inline-flex;align-items:center;gap:4px;color:var(--sh-good);font-weight:700}
.tg-cfoot .auto .ph{width:12px;height:12px}

/* ── live collection status (v6's rail, now a summary card above the grid) ── */
.cs-card{background:var(--sh-surface);border:1px solid var(--sh-border);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:9px;min-width:0}
.cs-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cs-h{font-size:12.5px;font-weight:800;display:inline-flex;align-items:center}
.cs-count{font-size:13px;font-weight:800;margin-inline-start:auto}
.cs-count b{font-size:20px;color:var(--sh-brand)}
.cs-count small{font-size:11.5px;font-weight:700;color:var(--sh-muted)}
.cs-bar{height:6px;border-radius:var(--sh-radius-pill);background:var(--sh-neutral-bg);overflow:hidden}
.cs-bar i{display:block;height:100%;background:var(--sh-good);border-radius:inherit}
.cs-pend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11.5px;color:var(--sh-text-2)}
.cs-chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:11px;font-weight:700;color:var(--sh-text-2);background:var(--sh-warn-bg);border:1px solid var(--sh-warn-border);border-radius:var(--sh-radius-pill);padding:3px 10px;cursor:pointer}
.cs-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--sh-warn)}
.cs-chip .cnt{color:var(--sh-muted);font-weight:600}
.cs-chip:hover{border-color:var(--sh-warn)}
.cs-ov{font-size:11.5px;color:var(--sh-muted);line-height:1.75}
.cs-empty{font-size:11.5px;color:var(--sh-muted-2);font-style:italic}

/* ── hero ── */
.cap-hero{margin:2px 2px 4px}
.cap-hero-q{font-size:21px;font-weight:800;letter-spacing:-.3px;line-height:1.4;display:flex;align-items:center;flex-wrap:wrap}
.cap-hero-s{font-size:12.5px;color:var(--sh-muted);line-height:1.85;margin-top:7px}

/* ── starter page (from rb-amp-builder.css: .tg-split / .tg-roles / .tg-role) ── */
.tg-starter{display:flex;flex-direction:column;gap:10px;min-width:0}
.tg-split.solo{grid-template-columns:minmax(0,1fr)}
.tg-split{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:16px;align-items:start;margin-top:4px}
.tg-roles{display:flex;flex-direction:column;gap:10px;background:var(--sh-surface);border:1px solid var(--sh-border);border-radius:12px;padding:12px;min-width:0}
.tg-rolesh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.tg-rolesh b{display:inline-flex;align-items:center}
.tg-rolesh .sh-chip{margin-inline-start:auto}
.tg-pack{border:1px solid var(--sh-border);border-radius:10px;overflow:hidden;min-width:0}
.tg-packh{display:flex;align-items:center;gap:8px;width:100%;background:var(--sh-surface-2);border:none;font:inherit;color:var(--sh-text);padding:9px 10px;cursor:pointer;text-align:start;flex-wrap:wrap}
.tg-packh b{font-size:12.5px}
.tg-packh .sh-chip{font-size:10.5px}
.tg-packh .car{margin-inline-start:auto;width:16px;height:16px;color:var(--sh-text-2);transition:transform var(--sh-duration-fast,120ms) var(--sh-ease-standard,ease-out)}
.tg-pack.open .tg-packh .car{transform:rotate(180deg)}
.tg-packd{font-size:11px;color:var(--sh-muted);line-height:1.6;flex-basis:100%}
.tg-packb{display:flex;flex-direction:column;gap:8px;padding:9px;min-width:0}
.tg-role{display:flex;flex-direction:column;gap:7px;border:1px solid var(--sh-border);border-radius:10px;padding:10px 11px;background:var(--sh-surface);min-width:0;transition:box-shadow var(--sh-duration-fast,120ms) var(--sh-ease-standard,ease-out)}
.tg-role.empty{border-style:dashed;border-color:var(--sh-warn-border);background:var(--sh-warn-bg)}
.tg-role.flash{box-shadow:0 0 0 2px var(--sh-brand)}
.tg-rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;min-width:0}
.tg-evn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700;direction:ltr;unicode-bidi:isolate;color:var(--sh-text);overflow-wrap:anywhere;min-width:0}
.tg-rn{font-size:10.5px;color:var(--sh-muted);white-space:nowrap}
.tg-rdef{font-size:11.5px;line-height:1.7;color:var(--sh-muted)}
.tg-rfeed{font-size:11px;color:var(--sh-muted-2);line-height:1.6}
.tg-rfeed b{color:var(--sh-text-2);font-weight:700}
.tg-auto{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--sh-good)}
.tg-auto .ph{width:13px;height:13px}
.tg-wait1{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:10.5px;font-weight:700;color:var(--sh-info);background:var(--sh-info-bg);border:1px solid var(--sh-info-border);border-radius:var(--sh-radius-pill);padding:3px 10px;cursor:pointer;align-self:flex-start}
.tg-wait1 .ph{width:13px;height:13px}
.tg-hs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tg-hshint{font-size:11px;color:var(--sh-text-2);line-height:1.6;flex:1;min-width:140px}
.tg-hsbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sh-brand-border);background:var(--sh-brand-soft);color:var(--sh-brand);font:inherit;font-size:11.5px;font-weight:800;padding:6px 13px;border-radius:var(--sh-radius-pill);cursor:pointer;white-space:nowrap;transition:background-color var(--sh-duration-fast,120ms) var(--sh-ease-standard,ease-out),color var(--sh-duration-fast,120ms) var(--sh-ease-standard,ease-out),border-color var(--sh-duration-fast,120ms) var(--sh-ease-standard,ease-out)}
.tg-hsbtn:hover{background:var(--sh-brand);color:var(--sh-bg);border-color:var(--sh-brand)}
.tg-schbtn{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;background:none;border:none;font:inherit;font-size:11px;font-weight:700;color:var(--sh-text-2);padding:2px 0;cursor:pointer}
.tg-schbtn .ph{width:13px;height:13px;transition:transform var(--sh-duration-fast,120ms) var(--sh-ease-standard,ease-out)}
.tg-schbtn[aria-expanded="true"] .ph{transform:rotate(180deg)}
.tg-schbtn:hover{color:var(--sh-brand)}
.tg-sch{display:flex;flex-direction:column;gap:8px;min-width:0}
.cap-fields{display:flex;gap:6px;flex-wrap:wrap}
.cap-fchip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px;border:1px solid var(--sh-border-2);background:var(--sh-neutral-bg);color:var(--sh-text-2);unicode-bidi:isolate;direction:ltr;overflow-wrap:anywhere}
.cap-fchip.req{border-color:var(--sh-brand-border);background:var(--sh-brand-soft);color:var(--sh-text)}
.cap-fchip .ty{color:var(--sh-muted)}
.cap-fnone{font-size:11px;color:var(--sh-muted-2);font-style:italic}
.cap-code{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap-code-pre{margin:0;background:var(--sh-surface-2);border:1px solid var(--sh-border);border-radius:9px;padding:10px 10px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.8;direction:ltr;text-align:left;color:var(--sh-text-2);white-space:pre;overflow-x:auto;max-width:100%}
.cap-code-copy{align-self:flex-start}
.tg-canvas{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:12px}
.tg-canvh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800}
.tg-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tg-tile{background:var(--sh-surface);border:1px solid var(--sh-border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.tg-tile.text{grid-column:1/-1;background:var(--sh-surface-2)}
.tg-tile.text h3{margin:0 0 4px;font-size:14px}
.tg-tile.text div{font-size:12px;line-height:1.85;color:var(--sh-text-2)}
.tg-tilet{font-size:12.5px;font-weight:800;line-height:1.5}
.tg-tiled{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--sh-muted)}
.tg-type{font-size:10px;font-weight:800;padding:1px 7px;border-radius:var(--sh-radius-pill);background:var(--sh-neutral-bg);color:var(--sh-text-2);border:1px solid var(--sh-border-2)}
.tg-tile>svg{display:block;width:100%;height:56px}
.tg-ready{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--sh-good)}
.tg-ready .ph{width:13px;height:13px}
.tg-wait{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;line-height:1.8;color:var(--sh-muted);padding:9px 10px;border:1px dashed var(--sh-border-2);border-radius:10px}
.tg-wait>.ph{width:16px;height:16px;margin-top:3px}
.tg-evlink{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:700;direction:ltr;unicode-bidi:isolate;background:var(--sh-warn-bg);border:1px solid var(--sh-warn-border);color:var(--sh-text);border-radius:6px;padding:2px 8px;cursor:pointer;margin:3px;display:inline-flex;align-items:center;min-height:24px;vertical-align:middle}
.tg-evlink:hover{border-color:var(--sh-warn)}

/* ── per-project status pieces (PM 2026-10-31) ── */
.cs-proj{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--sh-text-2);background:var(--sh-neutral-bg);border:1px solid var(--sh-border-2);border-radius:var(--sh-radius-pill);padding:2px 9px}
.cs-proj .ph{width:13px;height:13px}
.cs-first{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sh-info)}
.cs-first .ph{width:14px;height:14px}
.cs-noev{display:flex;gap:10px;align-items:flex-start;background:var(--sh-info-bg);border:1px solid var(--sh-info-border);border-radius:10px;padding:11px 12px}
.cs-noev>.ph{width:18px;height:18px;color:var(--sh-info);margin-top:2px}
.cs-noev-t{font-size:13px;font-weight:800;color:var(--sh-text)}
.cs-noev-h{font-size:11.5px;color:var(--sh-text-2);line-height:1.8;margin-top:2px}
.tg-first{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--sh-info)}
.tg-first .ph{width:13px;height:13px}
.tg-ready.first{color:var(--sh-info)}
.tg-cfoot .bycode{display:inline-flex;align-items:center;gap:4px;color:var(--sh-text-2);font-weight:700}
.tg-cfoot .bycode .ph{width:12px;height:12px}
.rbx-callout.good{background:var(--sh-good-bg);border-color:var(--sh-good-border)}
.rbx-callout.good>.ph{color:var(--sh-good)}
.cap-link{color:var(--sh-brand);font-weight:800;text-decoration:underline}

/* ── save modal (from rb-shell.css: .rbx-ov / .rbx-modal / .rbx-field / .rbx-pick) ── */
.rbx-ov{position:fixed;inset:0;background:var(--sh-overlay,rgba(0,0,0,.42));z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity var(--sh-duration-fast,140ms) var(--sh-ease-decelerate,ease-out)}
.rbx-ov.show{opacity:1}
.rbx-modal{background:var(--sh-surface);border:1px solid var(--sh-border);border-radius:calc(var(--sh-radius) + 4px);box-shadow:var(--sh-shadow-2);width:520px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;transform:translateY(8px);transition:transform var(--sh-duration-fast,140ms) var(--sh-ease-decelerate,ease-out)}
.rbx-ov.show .rbx-modal{transform:none}
.rbx-mhead{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.rbx-mtitle{font-size:15px;font-weight:800;flex:1}
.rbx-mx{background:none;border:none;cursor:pointer;color:var(--sh-muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.rbx-mx:hover{color:var(--sh-text);background:var(--sh-neutral-bg)}
.rbx-msub{font-size:11.5px;color:var(--sh-muted);padding:0 18px;line-height:1.9}
.rbx-mbody{padding:14px 18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.rbx-mfoot{display:flex;align-items:center;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--sh-border)}
.rbx-field{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:800;color:var(--sh-text-2)}
.rbx-field .sh-input{width:100%;box-sizing:border-box;font-weight:400}
.rbx-field textarea.sh-input{font:inherit;font-size:12px;font-weight:400;color:var(--sh-text);background:var(--sh-surface-2);border:1px solid var(--sh-border-2);border-radius:var(--sh-radius);padding:8px 10px;min-height:56px;resize:vertical}
.rbx-note{font-size:11px;font-weight:400;color:var(--sh-muted);line-height:1.8}
.rbx-err{font-size:11px;font-weight:700;color:var(--sh-bad)}
.rbx-pick{display:flex;flex-direction:column;border:1px solid var(--sh-border);border-radius:var(--sh-radius);max-height:200px;overflow:auto}
.rbx-pickrow{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--sh-border);font-size:12px;color:var(--sh-text)}
.rbx-pickrow:last-child{border-bottom:none}
.rbx-pickrow .grow{flex:1;min-width:0}
.rbx-pickrow .ph{width:14px;height:14px;color:var(--sh-muted)}
@media (prefers-reduced-motion:reduce){.rbx-ov,.rbx-ov .rbx-modal{transition:opacity var(--sh-duration-fast,140ms) linear}.rbx-ov .rbx-modal{transform:none}}

/* ── skeleton loading (gallery shape) ── */
.cap-skel{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
.cap-skel-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cap-sk{background:var(--sh-surface);border:1px solid var(--sh-border);border-radius:12px;position:relative;overflow:hidden}
.cap-sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--sh-neutral-bg),transparent);animation:capsheen 1.3s infinite}
@keyframes capsheen{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.cap-sk.h60{height:60px}.cap-sk.h220{height:220px}.cap-sk.h300{height:300px}
.cap-skel-m{display:flex;flex-direction:column;gap:12px}

/* reduced motion: same weight as the rules it cancels */
@media (prefers-reduced-motion:reduce){
  .cap-sk::after{animation:none}
  .tg-card,.tg-role,.tg-hsbtn{transition:none}
  .tg-packh .car,.tg-schbtn .ph{transition:none}
}

/* ── responsive (the builder's breakpoints) ── */

  /* ─────────── roles and project (the report builder's own parsing, rb-shell.js) ───────────
     PM 2026-10-28, TD-2: a dashboard saved from a template saves its charts, so only the project owner or an admin saves.
     ?prole=owner|admin|member|viewer (default admin; «manager» = admin; ?role=viewer = viewer). */
  var ROLE  = qs.get('role')==='viewer' ? 'viewer' : 'editor';
  var PROLE = (function(){ var r=qs.get('prole'); if(r==='manager') r='admin'; return ['owner','admin','member','viewer'].indexOf(r)>-1 ? r : (ROLE==='viewer'?'viewer':'admin'); })();
  function canSave(){ return ROLE!=='viewer' && (PROLE==='owner' || PROLE==='admin'); }

  function readProject(lsOnly){ var q=qs.get('project'); if(!lsOnly && q!=null && /^[0-3]$/.test(q)) return +q;
    try{ var v=JSON.parse(localStorage.getItem('shahin-nav-project')); return (v>=0 && v<=3) ? v : 0; }catch(e){ return 0; } }
  var PROJ = readProject();

      var sug=r.prefer.filter(rbSent), rest=rbSentList().filter(function(e){ return sug.indexOf(e.id)<0; }), q=Q.toLowerCase();
      function hit(e){ return !q || (e.fa+' '+e.en+' '+e.id).toLowerCase().indexOf(q)>-1; }
      function row(e, s){ return '<button class="rbx-pickrow tg-pickrow'+(b[r.id]===e.id?' on':'')+'" data-ev="'+esc(e.id)+'" type="button">'+ic(s?'star':'lightning')+'<span class="grow">'+esc(t(e.fa,e.en))+'</span><span class="tg-evid" dir="ltr">'+esc(e.id)+'</span></button>'; }
      var S1=sug.map(function(id){ return RB.evById(id); }).filter(hit), S2=rest.filter(hit), h='';
      if (S1.length) h+='<div class="tg-pickh">'+t('پیشنهاد برای این نقش','Suggested for this role')+'</div>'+S1.map(function(e){ return row(e, true); }).join('');
      if (S2.length) h+='<div class="tg-pickh">'+t('همه ایونت‌های این پروژه','All of this project’s events')+'</div>'+S2.map(function(e){ return row(e, false); }).join('');
      return h || '<div class="sh-state"><div class="sh-state-title">'+t('ایونتی پیدا نشد','No events found')+'</div><div class="sh-state-hint">'+t('این پروژه هنوز ایونتی با این نام نفرستاده.','This project hasn’t sent an event by that name yet.')+'</div></div>'; }
    var ov=overlay(esc(t('ایونت نقش «'+r.fa+'»','Event for “'+r.en+'”')), esc(t(r.dFa, r.dEn)),
      '<input class="sh-input" id="capPickQ" type="search" aria-label="'+esc(t('جستجوی ایونت','Search events'))+'" placeholder="'+esc(t('جستجوی ایونت…','Search events…'))+'"/><div class="rbx-pick tg-picklist" id="capPickL">'+list()+'</div>',
      '<button class="sh-btn ghost compact" type="button" data-mclose="1">'+t('انصراف','Cancel')+'</button>');
    ov.addEventListener('click', function(e){ var y=e.target.closest('[data-ev]'); if (!y) return; setPick(x, r.id, y.getAttribute('data-ev')); closeModal(); paint(); });
    $('capPickQ').addEventListener('input', function(e){ Q=e.target.value; $('capPickL').innerHTML=list(); });
    setTimeout(function(){ var f=$('capPickQ'); if (f) f.focus(); }, 60); }

  /* ── a customer template's ⋯ menu (TG-14 copy here; editing, publishing and removing open the template dashboard in the builder) ── */
  function closeMenu(){ var m=$('capMenu'); if (m && m.parentNode) m.parentNode.removeChild(m); }
  function orgMenu(anchor, o){
    closeMenu();
    var cp=canSave(), m=document.createElement('div'); m.className='i8-menu'; m.id='capMenu'; m.setAttribute('role','menu');
    function it(k, icon, fa, en, dis, hint){ return '<button class="i8-mi" type="button" role="menuitem" data-mi="'+k+'"'+(dis?' disabled':'')+'>'+ic(icon)+'<span class="grow">'+t(fa,en)+(hint?'<small>'+t(hint[0],hint[1])+'</small>':'')+'</span></button>'; }
    m.innerHTML=it('open','arrow-square-out','باز کردن قالب در گزارش‌ساز','Open the template in the report builder')+
      it('link','link','کپی لینک','Copy link')+
      it('copy','copy','کپی به پروژه دیگر…','Copy to another project…', !cp, !cp?['فقط مالک یا ادمین پروژه','Project owner or admin only']:null)+
      '<div class="i8-msep"></div>'+it('edit','pencil-simple','ویرایش، انتشار یا برداشتن قالب','Edit, publish or remove the template', false, ['در صفحه قالب در گزارش‌ساز','On the template’s page in the report builder']);
    document.body.appendChild(m);
    var r=anchor.getBoundingClientRect(), w=m.offsetWidth, rtl=document.documentElement.dir==='rtl';
    m.style.top=(r.bottom+window.scrollY+4)+'px';
    m.style.left=Math.max(8, Math.min(window.innerWidth-w-8, rtl ? r.left+window.scrollX : r.right+window.scrollX-w))+'px';
    m.addEventListener('click', function(e){ var y=e.target.closest('[data-mi]'); if (!y || y.disabled) return; var k=y.getAttribute('data-mi'); closeMenu();
      if (k==='open' || k==='edit') location.href=boardHref(o.id);
      else if (k==='link') copyText(location.origin+location.pathname.replace(/events-start\/[^/]*$/,'report-builder/v12.html')+'?board='+encodeURIComponent(o.id), 'لینک قالب کپی شد؛ فقط اعضای همین پروژه بازش می‌کنند','Template link copied; only members of this project can open it');
      else if (k==='copy') copyModal(o); });
    setTimeout(function(){ var f=m.querySelector('[data-mi]'); if (f) f.focus(); }, 0); }
  function copyText(s, fa, en){ try{ var pr=navigator.clipboard && navigator.clipboard.writeText(s); if (pr && pr.catch) pr.catch(function(){}); }catch(e){} toast(fa, en); }
  /* TG-14: the copy carries the charts, text, instructions and replacements; in the target project its events bind again */
  function snapshot(o){
    var cards=o.cards.map(function(c){ if (c.k==='text') return { k:'text', w:c.w||12, fa:c.fa, en:c.en||c.fa };
      return c.q ? { w:c.w||6, fa:c.fa, en:c.en, type:c.type, q:JSON.parse(JSON.stringify(c.q)) } : { w:6, fa:c.fa, en:c.en, type:c.type, q:{ amp:JSON.parse(JSON.stringify(c.amp)), range:c.range||'7d', filters:[] } }; });
    var evs=[]; cards.forEach(function(c){ if (c.q) evIdsOf(c.q, evs); }); evs=evs.filter(function(e, i){ return evs.indexOf(e)===i; });
    var x=o.tpl;
    return { id:'tplx'+PROJ+'_'+String(o.id).replace(/[^\w-]/g,'')+'_'+Date.now().toString(36), fa:o.fa, en:o.en, descFa:'', descEn:'', cards:cards, evs:evs,
      instr:x.instr||'', events:(x.events||[]).slice(), props:(x.props||[]).slice(), texts:(x.texts||[]).slice(), from:PROJ, at:Date.now() }; }
  function copyModal(o){
    if (!canSave()){ toast('فقط مالک یا ادمین پروژه','Project owner or admin only'); return; }
    var tg=PROJ_NAMES.map(function(p, i){ return i; }).filter(function(i){ return i!==PROJ; });
    overlay(t('کپی به پروژه دیگر','Copy to another project'), t('قالب با همان نمودارها، راهنما و جایگزینی‌ها در پروژه مقصد ساخته می‌شود. این قالب و داشبوردش تغییری نمی‌کنند.','The template is created in the target project with the same charts, instructions and replacements. This template and its dashboard don’t change.'),
      '<label class="rbx-field"><span>'+t('پروژه مقصد','Target project')+'</span><select class="sh-input" id="capXProj">'+tg.map(function(p){ return '<option value="'+p+'">'+esc(t(PROJ_NAMES[p][0], PROJ_NAMES[p][1]))+'</option>'; }).join('')+'</select>'+
        '<span class="rbx-note">'+t('فقط پروژه‌هایی که عضوشان هستید.','Only projects you’re a member of.')+'</span></label>'+
      '<div class="rbx-callout">'+ic('info')+'<span>'+t('در پروژه مقصد، هر ایونتی که آن پروژه می‌فرستد خودکار وصل می‌شود. برای ایونتی که آن پروژه نمی‌فرستد، همان‌جا پیش از ذخیره جایگزین انتخاب می‌کنید.','In the target project, each event that project sends is bound automatically. For an event it doesn’t send, you pick a replacement there before saving.')+'</span></div>',
      '<button class="sh-btn ghost compact" type="button" data-mclose="1">'+t('انصراف','Cancel')+'</button><button class="sh-btn primary compact" type="button" id="capXGo">'+t('کپی','Copy')+'</button>');
    $('capXGo').addEventListener('click', function(){
      var p=+$('capXProj').value;
      if (!CATL.writeCopies(p, CATL.readCopies(p).concat([snapshot(o)]))){ toast('کپی انجام نشد؛ دوباره تلاش کنید','The copy failed; try again'); return; }
      closeModal(); var nm=t(o.fa, o.en), pn=t(PROJ_NAMES[p][0], PROJ_NAMES[p][1]);
      toast('قالب «'+nm+'» در پروژه «'+pn+'» کپی شد؛ ایونت‌هایی که آن پروژه می‌فرستد خودکار وصل می‌شوند','Template “'+nm+'” copied to “'+pn+'”; events that project sends are bound automatically'); }); }

  /* ─────────── paint (never calls Shahin.i18n → no lang loop) ─────────── */
  function paint(){
    var main=$('capMain'), q=$('capQ'), hadFocus=q && document.activeElement===q, pos=hadFocus?q.selectionStart:0;
    main.innerHTML = S.view==='gallery' ? galleryView() : S.view.indexOf('tpl:')===0 ? tplView() : starterView();
    if (window.Shahin && Shahin.tooltips) Shahin.tooltips();
    if (hadFocus){ var q2=$('capQ'); if (q2){ q2.focus(); try{ q2.setSelectionRange(pos,pos); }catch(e){} } }
  }
  function openCat(id, packId){
    if (!CATMAP[id]) return;
    S.view=id; S.recent=[id].concat(S.recent.filter(function(x){ return x!==id; })).slice(0,6);
    if (packId) S.packOpen[packId]=true;
    paint(); window.scrollTo(0,0);
  }
  function gotoRole(k){
    var pid=k.split('__')[0]; S.packOpen[pid]=true; paint();
    var el=$('role-'+k); if (!el) return;
    el.scrollIntoView({ block:'center' }); el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 1600);
  }
  function toggleImpl(k){
    var m=impl(); m[k]=!m[k];
    var n=k.split('__')[1];
    if (m[k]) toast('افزودن کد ایونت «'+n+'» ثبت شد؛ منتظر اولین داده این ایونت هستیم و به‌محض رسیدن به شما خبر می‌دهیم.',
                    'Code for “'+n+'” marked as added; we’re waiting for this event’s first data and will let you know when it arrives.');
    paint();
  }

  /* ─────────── project switch: re-render in place (no reload), keep ?project= in step ─────────── */
  window.shahinBeforeProjectSwitch = function(pick){
    pick();
    PROJ = readProject(true);
    if (qs.get('project')!=null){ qs.set('project', String(PROJ)); try{ history.replaceState(null, '', location.pathname+'?'+qs.toString()); }catch(e){} }
    paint();
  };

  /* ─────────── interactions (delegated) ─────────── */
  function openTpl(id){ S.view='tpl:'+id; S.recent=[S.view].concat(S.recent.filter(function(x){ return x!==S.view; })).slice(0,6); paint(); window.scrollTo(0,0); }
  function curTpl(){ return S.view.indexOf('tpl:')===0 ? utpl(S.view.slice(4)) : null; }
  /* the use-case template in the save modal's own shape (a category's fields) */
  function tplSave(x){ return { id:'tpl:'+x.id, tpl:x.id, fa:x.fa, en:x.en, dFa:x.dFa, dEn:x.dEn, tiles:CATL.charts(x).map(function(c){ return { fa:c.fa, en:c.en, type:c.type }; }) }; }
  document.addEventListener('mousedown', function(e){ if ($('capMenu') && !e.target.closest('#capMenu') && !e.target.closest('[data-omenu]')) closeMenu(); });
  $('capMain').addEventListener('keydown', function(e){ var x=e.target.closest('[data-orgo]'); if (x && e.key==='Enter' && e.target===x) location.href=boardHref(x.getAttribute('data-orgo')); });
  $('capMain').addEventListener('click', function(e){
    var x;
    if ((x=e.target.closest('[data-omenu]'))){ e.stopPropagation(); var o=orgById(x.getAttribute('data-omenu')); if ($('capMenu')) closeMenu(); else if (o) orgMenu(x, o); return; }
    if ((x=e.target.closest('[data-orgo]'))){ location.href=boardHref(x.getAttribute('data-orgo')); return; }
    if ((x=e.target.closest('[data-tplo]'))){ openTpl(x.getAttribute('data-tplo')); return; }
    if ((x=e.target.closest('[data-tplink]'))){ copyText(location.origin+location.pathname+'?tpl='+encodeURIComponent(x.getAttribute('data-tplink')), 'لینک قالب کپی شد؛ فقط اعضای همین پروژه بازش می‌کنند','Template link copied; only members of this project can open it'); return; }
    if ((x=e.target.closest('[data-copytrack]'))){ copyText(track(x.getAttribute('data-copytrack')), 'کد کپی شد','Code copied'); return; }
    if ((x=e.target.closest('[data-pick]')) && curTpl()){ var ct=curTpl(), r=ct.roles.filter(function(y){ return y.id===x.getAttribute('data-pick'); })[0]; if (r) picker(ct, r); return; }
    if ((x=e.target.closest('[data-clear]')) && curTpl()){ setPick(curTpl(), x.getAttribute('data-clear'), ''); paint(); return; }
    if ((x=e.target.closest('.cap-copy'))){ e.stopPropagation(); var code=x.getAttribute('data-code'); try{ var pr=navigator.clipboard && navigator.clipboard.writeText(code); if (pr && pr.catch) pr.catch(function(){}); }catch(er){} toast('اسکیما کپی شد.', 'Schema copied.'); return; }
    if ((x=e.target.closest('[data-impl]'))){ toggleImpl(x.getAttribute('data-impl')); return; }
    if ((x=e.target.closest('[data-sch]'))){ var k=x.getAttribute('data-sch'); S.sch[k]=!S.sch[k]; paint(); return; }
    if ((x=e.target.closest('[data-goto]'))){ gotoRole(x.getAttribute('data-goto')); return; }
    if ((x=e.target.closest('[data-packh]'))){ var p=x.getAttribute('data-packh'), cur=x.getAttribute('aria-expanded')==='true'; S.packOpen[p]=!cur; paint(); return; }
    if ((x=e.target.closest('[data-open]'))){ openCat(x.getAttribute('data-open'), x.getAttribute('data-pack')); return; }
    if ((x=e.target.closest('[data-ind]'))){ S.ind=x.getAttribute('data-ind'); paint(); return; }
    if ((x=e.target.closest('[data-use]'))){ S.use=x.getAttribute('data-use'); paint(); return; }
    if ((x=e.target.closest('[data-sec]'))){ S.sec=x.getAttribute('data-sec'); S.q=''; paint(); return; }
    if ((x=e.target.closest('[data-back]'))){ S.view='gallery'; paint(); return; }
    if ((x=e.target.closest('#capSave'))){ var ct2=curTpl();
      if (x.disabled){ if (ct2 && canSave()) toast('برای ذخیره، به هر نقش یک ایونت بدهید.','Give every role an event to save.'); else toast(NO_SAVE[0], NO_SAVE[1]); return; }
      saveModal(ct2 ? tplSave(ct2) : CATMAP[S.view]); return; }
  });
  $('capMain').addEventListener('input', function(e){ if (e.target.id==='capQ'){ S.q=e.target.value; paint(); } });
  addEventListener('keydown', function(e){
    if (e.key!=='Escape') return;
    if ($('capMenu')){ closeMenu(); return; }
    if (modalClose){ modalClose(); return; }
    if (S.view!=='gallery' && !document.querySelector('#gtt[style*="block"]')){ S.view='gallery'; paint(); } });
  $('capRetry').addEventListener('click', function(){ mode('main'); paint(); });
  /* keep dynamic bilingual text in sync when language flips (handler ONLY re-paints) */
  document.addEventListener('shahin:lang', function(){ paint(); });
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML=ic(el.getAttribute('data-ic')); });

  /* ─────────── view mode ─────────── */
  function mode(m){
    $('capLoading').hidden = (m!=='loading');
    $('capError').hidden   = (m!=='error');
    $('capDenied').hidden  = (m!=='denied');
    $('capMain').hidden    = (m!=='main');
  }

  /* ─────────── boot: QA deep links (?state=loading|error|denied, ?tpl=commerce|content|cross|exchange or a use-case template id,
     ?sec=all|recent|biz|usecase|project|mine|full|wait, ?prole=…, ?project=0–3) ─────────── */
  var st = qs.get('state');
  if (st==='loading'){ mode('loading'); }
  else if (st==='error'){ mode('error'); }
  else if (st==='denied'){ mode('denied'); }
  else {
    mode('main');
    if (qs.get('tpl') && CATMAP[qs.get('tpl')]){ S.view=qs.get('tpl'); S.recent=[S.view]; }
    else if (qs.get('tpl') && CATS.some(function(c){ return c.tpl===qs.get('tpl'); })){ S.view=CATS.filter(function(c){ return c.tpl===qs.get('tpl'); })[0].id; S.recent=[S.view]; }   /* the builder's id (store, media, video, exchange) */
    else if (qs.get('tpl') && !SCOPE_BIZ && utpl(qs.get('tpl'))){ S.view='tpl:'+qs.get('tpl'); S.recent=[S.view]; }
    if (qs.get('sec') && inScope(qs.get('sec')) && ['all','recent','biz','usecase','project','mine','full','wait'].indexOf(qs.get('sec'))>-1) S.sec=qs.get('sec');
    paint();
  }
  window.CAPv7 = { state:S, stats:allStats, canSave:canSave, prole:PROLE, project:function(){ return PROJ; } };   /* QA */
})();
</script>
<script src="../assets/shahin-responsive.js"></script>
</body>
